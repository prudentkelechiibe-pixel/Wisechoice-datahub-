<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Store | WiseChoice Data Hub</title>

    <meta name="description" content="Explore mobile data and airtime services at WiseChoice Data Hub.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f9ff;
            color: #263445;
            line-height: 1.6;
        }

        header {
            background: #0756b5;
            padding: 18px 5%;
            color: white;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        nav {
            margin-top: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 16px;
            font-size: 14px;
        }

        .intro {
            background: linear-gradient(135deg, #0756b5, #1685e8);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .intro h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .networks {
            padding: 40px 20px;
            text-align: center;
        }

        .networks h2 {
            color: #0756b5;
            margin-bottom: 25px;
        }

        .network-card {
            background: white;
            max-width: 400px;
            margin: 18px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .network-card h3 {
            color: #0756b5;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .network-card p {
            margin-bottom: 12px;
        }

        .coming-soon {
            display: inline-block;
            background: #e7f1ff;
            color: #0756b5;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        footer {
            background: #073b78;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }
    </style>
    <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0756b5">
</head>

<body>

    <header>
        <div class="logo">WiseChoice Data Hub</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="store.html">Store</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="intro">
            <h1>Welcome to Our Store</h1>

            <p>
                Explore our mobile data and airtime
                services. Your connection matters to us.
            </p>
        </section>

<section class="networks">
<h2>Buy Mobile Data</h2>

<div class="network-card">
<label for="networkSelect">Choose Network</label>
<select id="networkSelect">
<option value="">Select Network</option>
<option value="MTN">MTN</option>
<option value="AIRTEL">Airtel</option>
<option value="GLO">Glo</option>
</select>

<label for="categorySelect">Choose Data Category</label>
<select id="categorySelect" disabled>
<option value="">Select Category</option>
</select>

<label for="planSelect">Choose Data Plan</label>
<select id="planSelect" disabled>
<option value="">Select Plan</option>
</select>

<p id="planPrice"></p>

<label for="phoneNumber">Recipient Phone Number</label>
<input type="tel" id="phoneNumber" placeholder="Enter phone number">

<button type="button" id="continueButton" disabled>
Continue
</button>

<p id="planMessage">Loading data plans will begin shortly.</p>
</div>
    </section>
    </main>

    <footer>
        <p>&copy; 2026 WiseChoice Data Hub. All rights reserved.</p>

        <p>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </p>
    </footer>
    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
            .then(registration => {
                console.log("WiseChoice PWA registered successfully!");
            })
            .catch(error => {
                console.error("PWA registration failed:", error);
            });
    });
}
    </script>

<script>
const API_URL = "https://wisechoice-api.prudentibe26.workers.dev/";
const networkSelect = document.getElementById("networkSelect");
const categorySelect = document.getElementById("categorySelect");
const planSelect = document.getElementById("planSelect");
const planPrice = document.getElementById("planPrice");
const phoneNumber = document.getElementById("phoneNumber");
const continueButton = document.getElementById("continueButton");
const planMessage = document.getElementById("planMessage");
let allPlans = [];

async function loadPlans() {
try {
const response = await fetch(API_URL);
const result = await response.json();
if (!response.ok || !result.success) throw Error("Loading failed");
allPlans = result.plans;
planMessage.textContent = "Data plans loaded successfully.";
} catch (error) {
planMessage.textContent = "Unable to load plans. Please refresh.";
}
}
loadPlans();

    networkSelect.addEventListener("change", () => {
const network = networkSelect.value;
const categories = [...new Set(allPlans.filter(p => p.network === network).map(p => p.category))];

categorySelect.innerHTML = '<option value="">Select Category</option>';
planSelect.innerHTML = '<option value="">Select Plan</option>';
categorySelect.disabled = !network;
planSelect.disabled = true;
planPrice.textContent = "";
continueButton.disabled = true;

categories.forEach(category => {
const option = document.createElement("option");
option.value = category;
option.textContent = category;
categorySelect.appendChild(option);
});
});
    categorySelect.addEventListener("change", () => {
const plans = allPlans.filter(p => p.network === networkSelect.value && p.category === categorySelect.value);
planSelect.innerHTML = '<option value="">Select Plan</option>';
plans.forEach((p, i) => {
const option = document.createElement("option");
option.value = i;
option.textContent = `${p.name} - ${p.validity} - ₦${p.price.toLocaleString()}`;
planSelect.appendChild(option);
});
planSelect.disabled = !plans.length;
planPrice.textContent = "";
continueButton.disabled = true;
});
    planSelect.addEventListener("change", () => {
const plans = allPlans.filter(p => p.network === networkSelect.value && p.category === categorySelect.value);
const selected = plans[Number(planSelect.value)];
planPrice.textContent = selected ? "Price: ₦" + selected.price.toLocaleString() : "";
continueButton.disabled = !selected;
});

continueButton.addEventListener("click", () => {
const phone = phoneNumber.value.trim();
if (!/^\d{11}$/.test(phone)) {
alert("Please enter a valid 11-digit phone number.");
return;
}
planMessage.textContent = "Your selection is ready. Order and payment processing will be connected in the next stage.";
});
</script>
    
</body>

</html>
